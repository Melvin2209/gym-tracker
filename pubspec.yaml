name: gym_tracker
description: "Offline-first strength training tracker: programs, fast set logging, rest timer, progress charts and PRs."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^7.0.0
  collection: ^1.19.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  firebase_auth: ^7.0.0
  firebase_core: ^5.0.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^3.4.3
  intl: ^0.20.3
  path: ^1.9.1
  path_provider: ^2.1.6
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  mocktail: ^1.0.5
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.otf
          weight: 800
